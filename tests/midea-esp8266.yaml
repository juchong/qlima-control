esphome:
  name: midea-esp8266-ci

esp8266:
  board: esp12e

external_components:
  - source: ../components
    components: [midea]

logger:
  baud_rate: 0

api:

wifi:
  ssid: test-network
  password: test-password

uart:
  tx_pin: GPIO12
  rx_pin: GPIO14
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

climate:
  - platform: midea
    name: Midea ESP8266 CI
    period: 5s
    timeout: 2s
    num_attempts: 2
    beeper: false
    autoconf: true
    telemetry_interval: 10s
    compressor_frequency:
      name: Compressor Frequency
    compressor_target_frequency:
      name: Compressor Target Frequency
    indoor_coil_temperature:
      name: Indoor Coil Temperature
    outdoor_coil_temperature:
      name: Outdoor Coil Temperature
    discharge_temperature:
      name: Discharge Temperature
    indoor_fan_speed:
      name: Indoor Fan Speed
    outdoor_fan_speed:
      name: Outdoor Fan Speed
    outdoor_unit_power:
      name: Outdoor Unit Power
    telemetry_groups:
      name: Requested Telemetry Groups
    appliance_error:
      name: Appliance Error
    error_code:
      name: Error Code
